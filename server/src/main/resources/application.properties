spring.application.name=editor-server
server.port=8082

# MongoDB is used for Phase 3 persistence configuration.
# Spring Boot 4 reads spring.mongodb.uri; spring.data.mongodb.uri is kept for the standard Spring Data name.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/collab_text_editor}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/collab_text_editor}

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:collabdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
