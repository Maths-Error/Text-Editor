services:
  mongo:
    image: mongo:7
    container_name: collab-text-editor-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - collab_mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: collab-text-editor-mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  collab_mongo_data: